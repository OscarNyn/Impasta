<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Imposter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow "case file" column per screen. Heavy expanded caps carry the personality; the red stamp is the single loud moment. */
:root{
  --bg:#E6E9F2;
  --card:#FFFFFF;
  --ink:#12162B;
  --on-ink:#F4F6FC;
  --mute:#565F80;
  --line:#C3CAE0;
  --stamp:#D42A24;
  --good:#16774F;
  --display:'Archivo','Arial Black',Impact,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1226;--card:#1A1E3B;--ink:#EEF1FB;--on-ink:#10132A;--mute:#9AA3CF;--line:#343A68;--stamp:#FF6459;--good:#4FD6A0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1226;--card:#1A1E3B;--ink:#EEF1FB;--on-ink:#10132A;--mute:#9AA3CF;--line:#343A68;--stamp:#FF6459;--good:#4FD6A0;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  font:400 1rem/1.5 var(--body);
  background:var(--bg);color:var(--ink);
  padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}

.wrap{max-width:30rem;margin-inline:auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.eyebrow{font:500 .72rem/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1,h2{margin:0;font-family:var(--display);font-stretch:118%;font-weight:900;text-transform:uppercase;letter-spacing:-.015em;line-height:.95;text-wrap:balance;overflow-wrap:anywhere}
h1{font-size:clamp(2.4rem,12vw,4rem)}
h2{font-size:clamp(1.9rem,9vw,2.8rem)}
.lede{margin:0;font-size:1.0625rem;max-width:34ch}
.note{margin:0;font-size:.875rem;color:var(--mute)}
.redact{background:var(--ink);color:var(--ink);border-radius:2px;padding:0 .3em}
.redact:hover,.redact:focus{color:var(--on-ink)}

.sec{display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.block{display:flex;flex-direction:column;gap:12px;min-width:0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:.5em;width:100%;min-height:56px;padding:14px 18px;
  border:2px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);
  font:900 1rem/1.1 var(--display);font-stretch:112%;text-transform:uppercase;letter-spacing:.04em;text-align:center;
  transition:transform .08s;
}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.small{width:auto;min-height:44px;padding:10px 14px;font-size:.8rem}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.players{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.prow{display:grid;grid-template-columns:2rem minmax(0,1fr) 44px;align-items:center;gap:8px}
.seat{font:700 .8rem var(--mono);color:var(--mute)}
.prow input{width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:500 1rem var(--body)}
.x{width:44px;height:44px;border:1.5px solid var(--line);border-radius:4px;background:transparent;font:500 1.25rem/1 var(--body);color:var(--mute)}
.x:disabled{opacity:.3;cursor:not-allowed}
.stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;gap:12px}
.x.step{width:56px;height:56px;border:2px solid var(--ink);font-size:1.75rem;color:var(--ink)}
.count{display:flex;flex-direction:column;align-items:center;text-align:center}
.count strong{font:900 2.8rem/1 var(--display);font-stretch:118%}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:4px;font:500 .9375rem var(--body);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

.rule{display:flex;flex-direction:column;gap:8px}
.rule-row{display:flex;justify-content:space-between;align-items:center;gap:16px}
.rule-title{font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{min-height:46px;border:0;border-right:1.5px solid var(--line);background:var(--card);font:500 .95rem var(--body);color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.switch{flex:none;position:relative;width:56px;height:32px;padding:0;border-radius:999px;border:2px solid var(--ink);background:var(--card)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(24px);background:var(--on-ink)}

.pass{display:flex;flex-direction:column;gap:22px;padding-block:8px}
.who{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(2.6rem,14vw,4.6rem);line-height:.95;text-transform:uppercase;overflow-wrap:anywhere;margin-top:6px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;background:var(--line);border-radius:1px}
.progress i.on{background:var(--ink)}

.dossier{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.dhead{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1.5px dashed var(--line)}
.dbody{display:flex;gap:16px;align-items:flex-start}
.photo{flex:none;width:76px;height:92px;border:2px solid var(--ink);display:grid;place-items:center;font:900 1.9rem/1 var(--display);font-stretch:118%;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.dmeta{display:flex;flex-direction:column;gap:4px;min-width:0}
.dname{font-weight:700;font-size:1.125rem;overflow-wrap:anywhere}
.secret{margin:0;font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(2rem,10.5vw,3.2rem);line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.tag{display:inline-block;width:fit-content;border:1.5px solid var(--ink);padding:3px 8px;border-radius:3px;font:700 .72rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.tag.red{border-color:var(--stamp);color:var(--stamp)}
.stamp{
  align-self:flex-start;display:inline-block;margin:6px 8px 4px;padding:6px 14px;
  border:4px solid var(--stamp);outline:2px solid var(--stamp);outline-offset:3px;border-radius:4px;color:var(--stamp);
  font:900 clamp(1.8rem,9vw,2.6rem)/1 var(--display);font-stretch:118%;text-transform:uppercase;letter-spacing:.04em;
  transform:rotate(-7deg);animation:slam .35s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes slam{from{opacity:0;transform:rotate(-7deg) scale(1.8)}to{opacity:1;transform:rotate(-7deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.btn,.switch::after{transition:none}}

.clock{font:700 clamp(3.4rem,18vw,5rem)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.clock.done{color:var(--stamp)}
.bar{height:8px;background:var(--line);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink)}
.bar.done i{background:var(--stamp)}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.starter{display:flex;flex-direction:column;gap:4px}
.order{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.order li{display:flex;gap:8px;align-items:baseline;padding:8px 12px;border:1.5px solid var(--line);background:var(--card);border-radius:4px;font-weight:700;overflow-wrap:anywhere}
.order li:first-child{border-color:var(--ink)}
.order small{font:700 .7rem var(--mono);color:var(--mute)}

.pick{min-height:76px;padding:12px;border:2px solid var(--line);background:var(--card);border-radius:4px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;font:700 1.0625rem/1.25 var(--body);color:var(--ink);overflow-wrap:anywhere;min-width:0}
.pick small{font:700 .68rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pick[aria-pressed="true"]{border-color:var(--stamp);color:var(--stamp)}
.pick[aria-pressed="true"] small{color:var(--stamp)}

.verdict{display:flex;flex-direction:column;gap:10px}
.imps{display:flex;flex-wrap:wrap;gap:8px}
.board{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:minmax(0,1fr) auto 3ch;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.board li:last-child{border-bottom:0}
.nm{overflow-wrap:anywhere;font-weight:700}
.delta{font:700 .78rem/1 var(--mono);padding:4px 6px;border-radius:3px;border:1.5px solid var(--good);color:var(--good)}
.delta.zero{border-color:var(--line);color:var(--mute)}
.total{font:700 1.1rem/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
</style>

<div id="app"></div>

<script>
(function(){
  var app=document.getElementById('app');

  var CATS={
    food:{label:'Food',words:['Pizza','Sushi','Tacos','Pancakes','Ramen','Burger','Lasagna','Croissant','Dumplings','Curry','Popcorn','Waffles','Burrito','Falafel','Paella','Cheesecake','Donut','Hot dog','Omelette','Pretzel','Noodles','Salad','Sandwich','Ice cream','Fried rice','Kebab','Pie','Chocolate','Mango','Watermelon']},
    animals:{label:'Animals',words:['Penguin','Giraffe','Octopus','Kangaroo','Elephant','Dolphin','Owl','Chameleon','Panda','Flamingo','Hedgehog','Crocodile','Koala','Peacock','Squirrel','Shark','Camel','Bat','Zebra','Turtle','Wolf','Parrot','Jellyfish','Moose','Raccoon','Seal','Rabbit','Lobster','Gorilla','Swan']},
    places:{label:'Places',words:['Library','Airport','Beach','Hospital','Zoo','Museum','Cinema','Supermarket','Lighthouse','Casino','Castle','Farm','Gym','Subway station','Playground','Bakery','Desert','Volcano','Campsite','Aquarium','Stadium','Bank','Hotel','Laundromat','School','Carnival','Cave','Harbor','Rooftop','Night market']},
    jobs:{label:'Jobs',words:['Chef','Pilot','Teacher','Dentist','Firefighter','Farmer','Detective','Barber','Astronaut','Lifeguard','Mechanic','Plumber','Magician','Photographer','Librarian','Nurse','Carpenter','Journalist','Judge','Painter','DJ','Tailor','Pharmacist','Referee','Baker','Electrician','Archaeologist','Zookeeper','Postal worker','Fisherman']},
    objects:{label:'Objects',words:['Umbrella','Toothbrush','Backpack','Candle','Mirror','Scissors','Headphones','Hammock','Compass','Teapot','Ladder','Sunglasses','Alarm clock','Stapler','Skateboard','Telescope','Pillow','Wallet','Flashlight','Balloon','Vacuum cleaner','Kite','Piano','Suitcase','Lightbulb','Camera','Watch','Broom','Key','Bicycle']},
    sports:{label:'Sports & games',words:['Soccer','Chess','Basketball','Tennis','Swimming','Surfing','Bowling','Archery','Boxing','Karate','Golf','Skiing','Volleyball','Cricket','Darts','Fencing','Yoga','Rowing','Climbing','Badminton','Skateboarding','Table tennis','Hockey','Baseball','Marathon','Poker','Billiards','Rugby','Jenga','Hide and seek']},
    nature:{label:'Nature',words:['Rainbow','Waterfall','Thunder','Glacier','Rainforest','Island','Tornado','Moon','Sunrise','Coral reef','Canyon','Meadow','Swamp','Aurora','Earthquake','Snowflake','Geyser','Fog','Tide','Mountain','River','Storm','Cactus','Bamboo','Mushroom','Sunflower','Oak tree','Dune','Pond','Lightning']},
    countries:{label:'Countries',words:['Japan','Brazil','Egypt','Canada','Italy','Mexico','India','Norway','Kenya','Thailand','Peru','Greece','Australia','Iceland','Turkey','Vietnam','Morocco','Argentina','Sweden','Ireland','Portugal','Indonesia','Jamaica','Cuba','Switzerland','Nepal','Spain','Chile','Myanmar','Singapore']}
  };
  var TIMERS=[[0,'None'],[120,'2 min'],[180,'3 min'],[300,'5 min']];
  var STORE='imposter.v1';

  var nextId=1;
  var S={
    screen:'setup',
    players:[],
    cats:['food','animals','places','objects'],
    imposters:1,
    hint:true,
    timer:180,
    round:0,
    scores:{},
    used:{},
    game:null
  };

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n,w){return String(n).padStart(w||2,'0')}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function maxImp(n){return n>=9?3:n>=6?2:1}
  function fmt(t){return pad(Math.floor(t/60))+':'+pad(t%60)}

  function setCount(n){S.players=[];for(var i=1;i<=n;i++)S.players.push({id:i,name:'Player '+i})}
  function load(){
    var d=null;
    try{d=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
    if(d&&d.count>=3&&d.count<=12){
      setCount(d.count);
      if(Array.isArray(d.cats)){
        var ok=d.cats.filter(function(k){return CATS[k]});
        if(ok.length)S.cats=ok;
      }
      if(d.imposters>=1&&d.imposters<=3)S.imposters=d.imposters;
      if(typeof d.hint==='boolean')S.hint=d.hint;
      if(TIMERS.some(function(t){return t[0]===d.timer}))S.timer=d.timer;
    }
    if(!S.players.length)setCount(4);
    S.imposters=Math.min(S.imposters,maxImp(S.players.length));
  }
  function save(){
    try{
      localStorage.setItem(STORE,JSON.stringify({
        count:S.players.length,
        cats:S.cats,imposters:S.imposters,hint:S.hint,timer:S.timer
      }));
    }catch(e){}
  }

  /* ---------- sound, vibration, wake lock ---------- */
  var ac=null;
  function unlockAudio(){
    try{
      var C=window.AudioContext||window.webkitAudioContext;
      if(!ac&&C)ac=new C();
      if(ac&&ac.state==='suspended')ac.resume();
    }catch(e){}
  }
  function alarm(){
    try{
      if(ac){
        var o=ac.createOscillator(),g=ac.createGain();
        o.frequency.value=880;o.connect(g);g.connect(ac.destination);
        g.gain.setValueAtTime(.2,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.9);
        o.start();o.stop(ac.currentTime+.9);
      }
    }catch(e){}
    try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  }
  function keepAwake(){
    try{
      if(navigator.wakeLock){navigator.wakeLock.request('screen').catch(function(){})}
    }catch(e){}
  }

  /* ---------- timer ---------- */
  var tick=null;
  function stopTick(){if(tick){clearInterval(tick);tick=null}if(S.game)S.game.running=false}
  function updateTimer(){
    var g=S.game,c=document.getElementById('clock'),b=document.getElementById('bar');
    if(!g||!c)return;
    c.textContent=fmt(g.timeLeft);
    c.classList.toggle('done',g.timeLeft===0);
    if(b){
      b.classList.toggle('done',g.timeLeft===0);
      b.firstElementChild.style.width=(g.total?Math.max(0,g.timeLeft/g.total*100):0)+'%';
    }
  }
  function startTick(){
    var g=S.game;
    if(tick||!g||g.timeLeft<=0)return;
    g.running=true;
    tick=setInterval(function(){
      g.timeLeft--;
      if(g.timeLeft<=0){
        g.timeLeft=0;stopTick();alarm();render();
      }else{updateTimer()}
    },1000);
  }

  /* ---------- game flow ---------- */
  function go(screen){S.screen=screen;render();window.scrollTo(0,0)}

  function startRound(){
    stopTick();
    S.players.forEach(function(p){if(S.scores[p.id]==null)S.scores[p.id]=0});
    var n=S.players.length;
    var nImp=Math.min(S.imposters,maxImp(n));
    var cat=pick(S.cats);
    var pool=CATS[cat].words;
    var used=S.used[cat]||(S.used[cat]=[]);
    var fresh=pool.filter(function(w){return used.indexOf(w)<0});
    if(!fresh.length){used.length=0;fresh=pool}
    var word=pick(fresh);
    used.push(word);
    var imp=shuffle(S.players).slice(0,nImp).map(function(p){return p.id});
    S.round++;
    S.game={
      cat:cat,word:word,imp:imp,idx:0,
      fileNo:100+Math.floor(Math.random()*900),
      starter:Math.floor(Math.random()*n),
      total:S.timer,timeLeft:S.timer,running:false,
      suspects:[],stage:null,caught:false,impWin:false,delta:{}
    };
    keepAwake();
    go('pass');
  }

  function finish(impWin){
    var g=S.game;
    g.impWin=impWin;g.stage='final';g.delta={};
    S.players.forEach(function(p){
      var isImp=g.imp.indexOf(p.id)>=0;
      var d=isImp?(impWin?2:0):(impWin?0:1);
      g.delta[p.id]=d;
      S.scores[p.id]=(S.scores[p.id]||0)+d;
    });
  }

  function nameOf(id){
    for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return S.players[i].name;
    return '';
  }

  /* ---------- screens ---------- */
  function boardHTML(delta){
    var rows=S.players.slice().sort(function(a,b){return (S.scores[b.id]||0)-(S.scores[a.id]||0)});
    return '<ol class="board">'+rows.map(function(p){
      var d=delta?(delta[p.id]||0):null;
      var chip=d===null?'<span></span>':'<span class="delta'+(d?'':' zero')+'">'+(d?'+'+d:'0')+'</span>';
      return '<li><span class="nm">'+esc(p.name)+'</span>'+chip+'<span class="total">'+(S.scores[p.id]||0)+'</span></li>';
    }).join('')+'</ol>';
  }

  function setupHTML(){
    var n=S.players.length,maxI=maxImp(n);
    var chips=Object.keys(CATS).map(function(k){
      return '<button class="chip" data-act="cat" data-k="'+k+'" aria-pressed="'+(S.cats.indexOf(k)>=0)+'">'+CATS[k].label+'</button>';
    }).join('');
    var impSeg=[1,2,3].map(function(v){
      return '<button data-act="imp" data-v="'+v+'" aria-pressed="'+(S.imposters===v)+'"'+(v>maxI?' disabled':'')+'>'+v+'</button>';
    }).join('');
    var timeSeg=TIMERS.map(function(t){
      return '<button data-act="tm" data-v="'+t[0]+'" aria-pressed="'+(S.timer===t[0])+'">'+t[1]+'</button>';
    }).join('');
    var standings='';
    if(S.round>0){
      standings='<div class="block"><div class="sec"><span class="eyebrow">Standings after '+S.round+' round'+(S.round>1?'s':'')+'</span></div>'+boardHTML(null)+
        '<button class="btn small" style="align-self:flex-start" data-act="resetScores">Reset scores</button></div>';
    }
    return ''+
      '<header class="block">'+
        '<div class="eyebrow">Case file · Pass-and-play · 3 to 12 players</div>'+
        '<h1>Imposter</h1>'+
        '<p class="lede">Everyone gets the same <span class="redact" tabindex="0">secret</span> word. Except one of you. Give clues, bluff, then vote.</p>'+
      '</header>'+
      standings+
      '<div class="block"><div class="sec"><span class="eyebrow">Players</span></div>'+
        '<div class="stepper"><button class="x step" data-act="remove" aria-label="Fewer players"'+(n<=3?' disabled':'')+'>&minus;</button>'+
          '<div class="count"><strong>'+n+'</strong><span class="note">Player 1 to Player '+n+'</span></div>'+
          '<button class="x step" data-act="add" aria-label="More players"'+(n>=12?' disabled':'')+'>+</button></div>'+
      '</div>'+
      '<div class="block"><div class="sec"><span class="eyebrow">Word categories</span></div><div class="chips">'+chips+'</div></div>'+
      '<div class="block"><div class="sec"><span class="eyebrow">Rules</span></div>'+
        '<div class="rule"><span class="rule-title">Imposters</span><div class="seg" role="group" aria-label="Number of imposters">'+impSeg+'</div>'+
          '<p class="note">'+(maxI===1?'One imposter until you have 6 players. Two at 6, three at 9.':'Up to '+maxI+' imposters with '+n+' players.')+'</p></div>'+
        '<div class="rule"><div class="rule-row"><span class="rule-title" id="hint-label">Imposter sees the category</span>'+
          '<button class="switch" role="switch" data-act="hint" aria-checked="'+S.hint+'" aria-labelledby="hint-label"></button></div>'+
          '<p class="note">A small clue so the imposter can bluff. Turn off for a harder game.</p></div>'+
        '<div class="rule"><span class="rule-title">Discussion timer</span><div class="seg" role="group" aria-label="Discussion timer">'+timeSeg+'</div></div>'+
      '</div>'+
      '<div class="stack"><button class="btn primary" data-act="start">'+(S.round>0?'Start next round':'Deal the cards')+'</button>'+
      '<p class="note">You pass the phone around so each person sees their own card in private.</p></div>';
  }

  function passHTML(){
    var g=S.game,n=S.players.length,p=S.players[g.idx];
    var dots='';
    for(var i=0;i<n;i++)dots+='<i'+(i<=g.idx?' class="on"':'')+'></i>';
    return '<section class="pass">'+
      '<div class="eyebrow">Round '+S.round+' · Card '+(g.idx+1)+' of '+n+'</div>'+
      '<div class="progress" aria-hidden="true">'+dots+'</div>'+
      '<div><div class="eyebrow">Pass the phone to</div><div class="who">'+esc(p.name)+'</div></div>'+
      '<p class="lede">Check that nobody else can see the screen, then open your card.</p>'+
      '<button class="btn primary" data-act="show">Show my card</button>'+
    '</section>';
  }

  function cardHTML(){
    var g=S.game,n=S.players.length,p=S.players[g.idx];
    var isImp=g.imp.indexOf(p.id)>=0;
    var initials=pad(g.idx+1);
    var last=g.idx===n-1;
    var body;
    if(isImp){
      body='<div class="eyebrow">Your role</div>'+
        '<div class="stamp">Imposter</div>'+
        '<p class="lede">You do not know the word. Listen to the clues and blend in.</p>'+
        (S.hint?'<div class="stack" style="gap:6px"><div class="eyebrow">Your only hint</div><span class="tag">'+esc(CATS[g.cat].label)+'</span></div>':'');
    }else{
      body='<div class="eyebrow">Secret word</div>'+
        '<p class="secret">'+esc(g.word)+'</p>'+
        '<span class="tag">'+esc(CATS[g.cat].label)+'</span>'+
        '<p class="note">Give a clue that proves you know it without making it easy for the imposter.</p>';
    }
    return '<section class="pass">'+
      '<div class="eyebrow">Round '+S.round+' · Card '+(g.idx+1)+' of '+n+' · Private</div>'+
      '<div class="dossier">'+
        '<div class="dhead"><span class="eyebrow">Case file No. '+pad(g.fileNo,4)+'</span><span class="eyebrow">Eyes only</span></div>'+
        '<div class="dbody"><div class="photo" aria-hidden="true">'+esc(initials)+'</div>'+
          '<div class="dmeta"><span class="eyebrow">Agent</span><span class="dname">'+esc(p.name)+'</span></div></div>'+
        '<div class="stack" style="gap:12px">'+body+'</div>'+
      '</div>'+
      '<button class="btn primary" data-act="hide">'+(last?'Hide card and begin':'Hide card and pass')+'</button>'+
    '</section>';
  }

  function talkHTML(){
    var g=S.game,n=S.players.length;
    var order='';
    for(var i=0;i<n;i++){
      var p=S.players[(g.starter+i)%n];
      order+='<li><small>'+pad(i+1)+'</small>'+esc(p.name)+'</li>';
    }
    var timer='';
    if(S.timer>0){
      var done=g.timeLeft===0;
      timer='<div class="panel">'+
        '<div class="eyebrow">'+(done?'Time is up. Call the vote.':'Time left')+'</div>'+
        '<div class="clock'+(done?' done':'')+'" id="clock" role="timer">'+fmt(g.timeLeft)+'</div>'+
        '<div class="bar'+(done?' done':'')+'" id="bar" aria-hidden="true"><i style="width:'+(g.total?g.timeLeft/g.total*100:0)+'%"></i></div>'+
        '<div class="row2"><button class="btn small" data-act="timerToggle"'+(done?' disabled':'')+'>'+(g.running?'Pause':'Start')+'</button>'+
        '<button class="btn small" data-act="plus30">+30 sec</button></div>'+
      '</div>';
    }
    return '<div class="block"><div class="eyebrow">Round '+S.round+' · Discussion</div><h2>Find the imposter</h2></div>'+
      '<div class="starter"><div class="eyebrow">Speaks first</div><div class="dname" style="font-size:1.5rem">'+esc(S.players[g.starter].name)+'</div></div>'+
      '<div class="block"><div class="eyebrow">Turn order</div><ol class="order">'+order+'</ol>'+
        '<p class="note">Go around the circle. Each person gives a one-word clue about the secret word. Then ask each other questions.</p></div>'+
      timer+
      '<button class="btn primary" data-act="toVote">Call the vote</button>';
  }

  function voteHTML(){
    var g=S.game,nImp=g.imp.length;
    var picks=S.players.map(function(p){
      var on=g.suspects.indexOf(p.id)>=0;
      return '<button class="pick" data-act="suspect" data-id="'+p.id+'" aria-pressed="'+on+'"><small>'+(on?'Suspect':'&nbsp;')+'</small><span>'+esc(p.name)+'</span></button>';
    }).join('');
    return '<div class="block"><div class="eyebrow">Round '+S.round+' · Vote</div><h2>Who is the imposter?</h2>'+
      '<p class="lede">Count the votes out loud, then select '+(nImp>1?'the '+nImp+' players with the most votes':'the player with the most votes')+'.</p></div>'+
      '<div class="grid2">'+picks+'</div>'+
      '<div class="stack"><button class="btn primary" data-act="reveal"'+(g.suspects.length===nImp?'':' disabled')+'>Reveal the truth</button>'+
      '<button class="btn" data-act="back">Keep talking</button></div>';
  }

  function resultHTML(){
    var g=S.game,nImp=g.imp.length,plural=nImp>1;
    var impTags='<div class="imps">'+g.imp.map(function(id){return '<span class="tag red">'+esc(nameOf(id))+'</span>'}).join('')+'</div>';
    var voted=g.suspects.map(nameOf).map(esc).join(', ');
    var caughtCount=g.suspects.filter(function(id){return g.imp.indexOf(id)>=0}).length;

    if(g.stage==='guess'){
      return '<div class="block"><div class="eyebrow">Round '+S.round+' · Last chance</div><h2>Caught!</h2></div>'+
        '<div class="panel"><div class="eyebrow">The '+(plural?'imposters were':'imposter was')+'</div>'+impTags+
        '<p class="lede">'+(plural?'Imposters, discuss and say one guess':'Imposter, say your guess')+' for the secret word out loud. Everyone else stays silent.</p></div>'+
        '<div class="row2"><button class="btn primary" data-act="guess" data-v="yes">Guessed it</button><button class="btn" data-act="guess" data-v="no">Wrong guess</button></div>';
    }

    var head,sub;
    if(!g.caught){
      head=caughtCount>0?'Some imposters slipped away':(plural?'The imposters got away':'The imposter got away');
      sub='The group voted out '+voted+'. '+(plural?'Imposters score 2 each.':'The imposter scores 2.');
    }else if(g.impWin){
      head='Caught, but they named the word';
      sub=(plural?'Imposters score 2 each.':'The imposter scores 2.');
    }else{
      head='Crew wins';
      sub='Everyone who was not an imposter scores 1.';
    }
    return '<div class="block verdict"><div class="eyebrow">Round '+S.round+' · Result</div><h2>'+head+'</h2><p class="lede">'+sub+'</p></div>'+
      '<div class="panel">'+
        '<div class="eyebrow">The '+(plural?'imposters were':'imposter was')+'</div>'+impTags+
        '<div class="eyebrow">The word was</div><p class="secret">'+esc(g.word)+'</p>'+
        '<span class="tag">'+esc(CATS[g.cat].label)+'</span>'+
      '</div>'+
      '<div class="block"><div class="sec"><span class="eyebrow">Scores</span></div>'+boardHTML(g.delta)+'</div>'+
      '<div class="stack"><button class="btn primary" data-act="next">Next round</button>'+
      '<button class="btn" data-act="edit">Change players or rules</button></div>';
  }

  function render(){
    var h='';
    switch(S.screen){
      case 'setup':h=setupHTML();break;
      case 'pass':h=passHTML();break;
      case 'card':h=cardHTML();break;
      case 'talk':h=talkHTML();break;
      case 'vote':h=voteHTML();break;
      case 'result':h=resultHTML();break;
    }
    app.innerHTML='<div class="wrap">'+h+'</div>';
  }

  /* ---------- events ---------- */
  app.addEventListener('input',function(e){
    var t=e.target;
    if(t.matches&&t.matches('[data-name]')){
      var i=+t.getAttribute('data-name');
      if(S.players[i]){S.players[i].name=t.value;save()}
    }
  });

  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');
    if(!b||b.disabled)return;
    unlockAudio();
    var g=S.game,n=S.players.length;
    switch(b.getAttribute('data-act')){
      case 'add':
        if(n<12){setCount(n+1);save();render()}
        break;
      case 'remove':
        if(n>3){setCount(n-1);S.imposters=Math.min(S.imposters,maxImp(S.players.length));save();render()}
        break;
      case 'cat':
        var k=b.getAttribute('data-k'),at=S.cats.indexOf(k);
        if(at>=0){if(S.cats.length>1)S.cats.splice(at,1)}else S.cats.push(k);
        save();render();
        break;
      case 'imp':S.imposters=+b.getAttribute('data-v');save();render();break;
      case 'hint':S.hint=!S.hint;save();render();break;
      case 'tm':S.timer=+b.getAttribute('data-v');save();render();break;
      case 'resetScores':S.scores={};S.round=0;S.used={};render();break;
      case 'start':startRound();break;
      case 'show':go('card');break;
      case 'hide':
        g.idx++;
        if(g.idx>=n){g.idx=n-1;go('talk')}else go('pass');
        break;
      case 'timerToggle':
        if(g.running){stopTick()}else{startTick()}
        render();
        break;
      case 'plus30':
        g.timeLeft+=30;if(g.timeLeft>g.total)g.total=g.timeLeft;
        render();
        break;
      case 'toVote':stopTick();g.suspects=[];go('vote');break;
      case 'back':go('talk');break;
      case 'suspect':
        var id=+b.getAttribute('data-id'),ix=g.suspects.indexOf(id);
        if(ix>=0)g.suspects.splice(ix,1);
        else{g.suspects.push(id);if(g.suspects.length>g.imp.length)g.suspects.shift()}
        render();
        break;
      case 'reveal':
        if(g.suspects.length!==g.imp.length)return;
        g.caught=g.imp.every(function(x){return g.suspects.indexOf(x)>=0});
        if(g.caught){g.stage='guess'}else{finish(true)}
        go('result');
        break;
      case 'guess':finish(b.getAttribute('data-v')==='yes');go('result');break;
      case 'next':startRound();break;
      case 'edit':stopTick();go('setup');break;
    }
  });

  load();
  render();
})();
</script>

</body></html>
